<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00A99D">
<title>App ประกอบรูป ปงสนุก</title>

<!-- PWA: ติดตั้งลงหน้าจอ + ทำงานออฟไลน์ -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ประกอบรูป">
<meta name="mobile-web-app-capable" content="yes">

<!-- ฟอนต์ไทยจาก Google Fonts (ต้องออนไลน์เฉพาะตอนโหลดฟอนต์ ที่เหลือทำงานออฟไลน์ได้) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===== ตัวแปรสีหลักของแอป ===== */
:root{
  --bg:#F5F7F7;
  --primary:#00A99D;
  --primary-dark:#008378;
  --text:#1A1A1A;
  --user-bubble:#D7F0EC;   /* บับเบิลผู้ใช้ พื้นเขียวอ่อน */
  --white:#FFFFFF;
  --muted:#6B7B7A;
  --line:#E2E8E7;
  --radius:16px;
  --danger:#D64545;
  --focus:#0B7F78;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{
  font-family:"Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  color:var(--text);
  background:#E6EBEB;               /* พื้นนอกกรอบ (เห็นตอนเปิดบนจอกว้าง) */
  -webkit-tap-highlight-color:transparent;
}

/* กรอบแอปแบบมือถือ จัดกึ่งกลางบนจอกว้าง */
.app{
  max-width:480px;
  margin:0 auto;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  overflow:hidden;
}

/* ===== แถบบนสุด ===== */
.topbar{
  flex:0 0 auto;
  background:var(--primary);
  color:var(--white);
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 12px;
  padding-top:calc(12px + env(safe-area-inset-top));
}
.topbar h1{
  font-size:17px;
  font-weight:700;
  margin:0;
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.icon-btn{
  appearance:none;
  border:none;
  background:rgba(255,255,255,.16);
  color:var(--white);
  min-width:44px;
  height:44px;
  padding:0 12px;
  border-radius:12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}
.icon-btn:active{ background:rgba(255,255,255,.30); }
.icon-btn svg{ width:22px; height:22px; display:block; }

/* ===== แผงตั้งค่า (พับเก็บได้) ===== */
.settings{
  flex:0 0 auto;
  background:var(--white);
  border-bottom:1px solid var(--line);
  overflow:hidden;
  max-height:0;
  transition:max-height .28s ease;
}
.settings.open{ max-height:640px; }
.settings-inner{ padding:14px 16px; display:flex; flex-direction:column; gap:16px; }
.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:13px; font-weight:600; color:var(--muted); }
.field .row-inline{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.text-input, .date-input{
  width:100%;
  height:48px;
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:0 14px;
  font-family:inherit;
  font-size:16px;
  color:var(--text);
  background:var(--white);
}
.date-input{ width:auto; min-width:160px; }
.date-display{ font-size:14px; color:var(--muted); font-weight:600; }

/* ปุ่มแบบแบ่งกลุ่ม (segmented) */
.seg{ display:inline-flex; background:var(--bg); border-radius:12px; padding:4px; gap:4px; }
.seg button{
  appearance:none; border:none; background:transparent;
  font-family:inherit; font-size:15px; font-weight:600; color:var(--muted);
  height:40px; padding:0 16px; border-radius:9px; cursor:pointer; min-width:64px;
}
.seg button[aria-pressed="true"]{ background:var(--primary); color:var(--white); }

/* ปุ่มปรับใช้ (พับแผงตั้งค่า) */
.apply-btn{
  margin-top:4px;
  height:48px; width:100%;
  border:2px solid var(--primary);
  background:var(--primary); color:#fff;
  border-radius:12px;
  font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
}
.apply-btn:active{ filter:brightness(.96); }

/* ===== พื้นที่แชท ===== */
.chat{
  flex:1 1 auto;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  position:relative;
  padding:12px 12px 20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
/* แถบเครื่องมือหัวแชท (ดาวน์โหลดทั้งหมด) */
.chat-tools{
  position:sticky;
  top:-12px;                 /* ชดเชย padding บนของ .chat */
  margin:-12px -12px 0;
  padding:8px 12px;
  background:linear-gradient(var(--bg), var(--bg) 70%, rgba(245,247,247,0));
  z-index:5;
  display:none;
}
.chat-tools.show{ display:block; }
.btn-all{
  width:100%;
  height:44px;
  border:1.5px solid var(--primary);
  background:var(--white);
  color:var(--primary-dark);
  border-radius:12px;
  font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
}
.btn-all:active{ background:#EAF7F5; }
.btn-all svg{ width:20px; height:20px; flex:0 0 auto; }
.btn-all.share{ background:#06C755; border-color:#06C755; color:#fff; margin-bottom:8px; }  /* เขียวไลน์ */
.btn-all.share:active{ background:#05b34c; }

/* ข้อความชวนเริ่ม */
.empty{
  margin:auto;
  text-align:center;
  color:var(--muted);
  font-size:15px;
  line-height:1.7;
  padding:24px;
}
.empty .big{ font-size:40px; margin-bottom:8px; }

/* แถวบับเบิล */
.row{ display:flex; }
.row.right{ justify-content:flex-end; }
.row.left{ justify-content:flex-start; }
.bubble{
  border-radius:var(--radius);
  padding:10px;
  max-width:84%;
}
.bubble.user{ background:var(--user-bubble); border-bottom-right-radius:6px; }
.bubble.result{ background:var(--white); box-shadow:0 2px 8px rgba(0,0,0,.08); border-bottom-left-radius:6px; }

/* แถวรูปย่อในบับเบิลผู้ใช้ */
.thumbs{ display:flex; gap:6px; flex-wrap:wrap; }
.thumb{
  position:relative;
  width:64px; height:64px;
  border-radius:10px;
  overflow:hidden;
  background:#ccc;
  flex:0 0 auto;
}
.thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.thumb .x{
  position:absolute; top:2px; right:2px;
  width:22px; height:22px; border-radius:50%;
  border:none; background:rgba(0,0,0,.55); color:#fff;
  font-size:14px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.pending-status{
  margin-top:8px; font-size:13px; font-weight:600; color:var(--primary-dark);
}

/* บับเบิลผลลัพธ์ */
.result img.output{
  width:100%; max-width:300px; border-radius:10px; display:block;
}
.loading{ display:flex; align-items:center; gap:10px; padding:20px 12px; color:var(--muted); font-size:14px; }
.spinner{
  width:22px; height:22px; border-radius:50%;
  border:3px solid var(--line); border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.actions{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.action{
  flex:1 1 auto;
  min-height:42px;
  border-radius:10px;
  border:1.5px solid var(--line);
  background:var(--white);
  color:var(--text);
  font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
  padding:0 8px;
}
.action.primary{ background:var(--primary); border-color:var(--primary); color:#fff; }
.action.share{ background:#06C755; border-color:#06C755; color:#fff; }  /* เขียวไลน์ */
.action.danger{ color:var(--danger); border-color:#F0C7C7; }
.action:active{ filter:brightness(.96); }
.action svg{ width:17px; height:17px; }

/* ===== แถบล่าง (เลือกรูป / ถ่ายรูป) ===== */
.composer{
  flex:0 0 auto;
  background:var(--white);
  border-top:1px solid var(--line);
  display:flex;
  gap:10px;
  padding:12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
}
.big-btn{
  flex:1;
  min-height:52px;
  border-radius:14px;
  font-family:inherit; font-size:16px; font-weight:700;
  cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:2px solid var(--primary);
}
.big-btn.primary{ background:var(--primary); color:#fff; }
.big-btn.ghost{ background:var(--white); color:var(--primary-dark); }
.big-btn:active{ filter:brightness(.96); }
.big-btn svg{ width:22px; height:22px; }
.big-btn input[type=file]{ display:none; }

/* โฟกัสริงให้เห็นชัด (การเข้าถึง) */
button:focus-visible, input:focus-visible, label:focus-within{
  outline:3px solid var(--focus);
  outline-offset:2px;
}

/* ชั้นซ้อนตอนลากไฟล์มาวาง */
.drop-overlay{
  position:fixed; inset:0; z-index:50;
  background:rgba(0,169,157,.12);
  border:4px dashed var(--primary);
  display:none; align-items:center; justify-content:center;
  color:var(--primary-dark); font-size:20px; font-weight:700;
  pointer-events:none;
}
.drop-overlay.show{ display:flex; }

/* ===== หน้าต่างปรับมุมรูป ===== */
.editor-overlay{
  position:fixed; inset:0; z-index:100;
  background:rgba(0,0,0,.55);
  display:none; align-items:center; justify-content:center;
  padding:16px;
}
.editor-overlay.show{ display:flex; }
.editor{
  background:var(--white); border-radius:18px;
  width:100%; max-width:360px;
  padding:16px; max-height:92dvh; overflow:auto;
  display:flex; flex-direction:column; gap:12px;
}
.editor h2{ font-size:17px; font-weight:700; margin:0; }
.editor .hint{ font-size:12.5px; color:var(--muted); margin:0; line-height:1.6; }
.edit-grid{
  width:100%; aspect-ratio:1/1;
  display:grid; gap:4px;
  background:#dfe6e5; border-radius:12px; overflow:hidden;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
.edit-cell{
  position:relative; overflow:hidden; background:#c9d2d1;
  cursor:grab;
}
.edit-cell img{
  position:absolute; left:50%; top:50%;
  transform-origin:center center;
  will-change:transform; pointer-events:none;
  max-width:none;               /* ใช้ขนาดจริงของรูป */
}
.edit-cell .num{
  position:absolute; top:5px; left:5px; z-index:2;
  min-width:22px; height:22px; padding:0 6px; border-radius:11px;
  background:rgba(0,0,0,.55); color:#fff;
  font-size:12px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.edit-cell.selected{ outline:3px solid var(--primary); outline-offset:-3px; }
.edit-cell.lift{ opacity:.35; }
.edit-cell.target{ outline:3px dashed var(--primary); outline-offset:-3px; }
.drag-ghost{
  position:fixed; z-index:120; width:84px; height:84px;
  border-radius:12px; overflow:hidden; pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
  transform:translate(-50%,-50%);
}
.drag-ghost img{ width:100%; height:100%; object-fit:cover; }
.edit-tools{ display:flex; flex-direction:column; gap:8px; }
.edit-tools .rowt{ display:flex; align-items:center; gap:10px; }
.edit-tools .rowt span{ font-size:13px; font-weight:600; color:var(--muted); width:42px; flex:0 0 auto; }
.edit-tools input[type=range]{ flex:1; accent-color:var(--primary); height:28px; }
.edit-tools .mini{
  align-self:flex-start;
  height:36px; padding:0 14px; border-radius:9px;
  border:1.5px solid var(--line); background:var(--white);
  font-family:inherit; font-size:13px; font-weight:600; color:var(--text); cursor:pointer;
}
.editor-actions{ display:flex; gap:8px; }
.editor-actions button{
  flex:1; height:48px; border-radius:12px;
  font-family:inherit; font-weight:700; font-size:15px; cursor:pointer;
  border:2px solid var(--primary);
}
.editor-actions .save{ background:var(--primary); color:#fff; }
.editor-actions .cancel{ background:var(--white); color:var(--primary-dark); }

/* เคารพผู้ที่ตั้งค่าลดการเคลื่อนไหว */
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>
<div class="app">

  <!-- แถบบนสุด -->
  <header class="topbar">
    <h1>App ประกอบรูป ปงสนุก</h1>
    <button class="icon-btn" id="btnSettings" aria-label="ตั้งค่า" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="icon-btn" id="btnClear" aria-label="ล้างแชท">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      <span>ล้างแชท</span>
    </button>
  </header>

  <!-- แผงตั้งค่า -->
  <section class="settings" id="settings" aria-hidden="true">
    <div class="settings-inner">
      <div class="field">
        <label for="sender">คำอธิบายเพิ่มเติม (ใส่ในป้ายใต้วันที่ ทุกรูป)</label>
        <input class="text-input" id="sender" type="text" inputmode="text" placeholder="เช่น ผลักดันการขายสินค้าแลกซื้อ" autocomplete="off">
      </div>

      <div class="field">
        <label for="date">วันที่</label>
        <div class="row-inline">
          <input class="date-input" id="date" type="date">
          <span class="date-display" id="dateDisplay"></span>
        </div>
      </div>

      <div class="field">
        <label>จำนวนรูปต่อชุด</label>
        <div class="seg" id="segCount" role="group" aria-label="จำนวนรูปต่อชุด">
          <button type="button" data-count="1" aria-pressed="false">1 รูป</button>
          <button type="button" data-count="2" aria-pressed="true">2 รูป</button>
          <button type="button" data-count="4" aria-pressed="false">4 รูป</button>
        </div>
      </div>

      <div class="field" id="layoutField">
        <label>รูปแบบการวาง (2 รูป)</label>
        <div class="seg" id="segLayout" role="group" aria-label="รูปแบบการวาง">
          <button type="button" data-layout="lr" aria-pressed="true">ซ้าย-ขวา</button>
          <button type="button" data-layout="tb" aria-pressed="false">บน-ล่าง</button>
        </div>
      </div>

      <div class="field" id="grid4Field" style="display:none">
        <label>รูปแบบป้าย (4 รูป)</label>
        <div class="seg" id="segGrid4" role="group" aria-label="รูปแบบป้าย 4 รูป">
          <button type="button" data-grid4="bottom" aria-pressed="false">ป้ายล่าง</button>
          <button type="button" data-grid4="center" aria-pressed="true">จัดมุม (ป้ายกลาง)</button>
        </div>
      </div>

      <div class="field" id="dupField" style="display:none">
        <label>ทำซ้ำรูปเดียว (ใช้รูป 1 ใบ เติมทุกช่อง)</label>
        <div class="seg" id="segDup" role="group" aria-label="ทำซ้ำรูปเดียว">
          <button type="button" data-dup="off" aria-pressed="true">ปิด</button>
          <button type="button" data-dup="on" aria-pressed="false">เปิด</button>
        </div>
      </div>

      <button type="button" class="apply-btn" id="btnApply">ปรับใช้</button>
    </div>
  </section>

  <!-- พื้นที่แชท -->
  <main class="chat" id="chat" aria-live="polite">
    <div class="chat-tools" id="chatTools">
      <button class="btn-all share" id="btnShareAll">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.3c-5 0-9 3.15-9 7.02 0 3.47 3.18 6.38 7.47 6.93.29.06.69.19.79.44.09.22.06.57.03.79l-.13.77c-.04.23-.18.9.79.49.97-.41 5.23-3.08 7.14-5.28C21.13 14.05 22 12.6 22 10.32 22 6.45 17.5 3.3 12 3.3z"/></svg>
        แชร์ทั้งหมดไปไลน์
      </button>
      <button class="btn-all" id="btnAll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        ดาวน์โหลดทั้งหมด
      </button>
    </div>
    <div class="empty" id="empty">
      <div class="big">📸</div>
      <div id="emptyText">เลือกรูปหรือถ่ายรูปเพื่อเริ่ม<br>ส่งครั้งละ 2 รูป</div>
    </div>
  </main>

  <!-- แถบล่าง -->
  <footer class="composer">
    <label class="big-btn ghost" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      เลือกรูป
      <input id="filePick" type="file" accept="image/*" multiple>
    </label>
    <label class="big-btn primary" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      ถ่ายรูป
      <input id="fileCam" type="file" accept="image/*" capture="environment">
    </label>
  </footer>
</div>

/* ===== ตั้งค่า/บันทึกค่า (localStorage) ===== */
function saveSettings(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      sender: senderInput.value,
      count: state.setCount,
      layout: state.layout,
      grid4: state.grid4,
      dup: state.dup
    }));
  }catch(e){}
}
function loadSettings(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; }
}

function todayYMD(){
  const t=new Date(), p=n=>String(n).padStart(2,'0');
  return `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;
}
function formatDDMMYY(ymd){
  if(!ymd) return '';
  const [y,m,d]=ymd.split('-');
  return `${d}/${m}/${y.slice(2)}`;
}
function updateDateDisplay(){
  dateDisplay.textContent = 'แสดงผล: ' + formatDDMMYY(dateInput.value);
}

/* ===== ชื่อไฟล์ผลลัพธ์ ===== */
function buildFileName(index){
  const ymd=(dateInput.value||todayYMD()).replace(/-/g,'');
  const parts=['6586', ymd];
  parts.push(String(index).padStart(2,'0'));
  return parts.join('_')+'.jpg';
}

/* ===== โหลดรูปให้หมุนถูกด้านตาม EXIF ===== */
async function loadBitmap(file){
  try{ return await createImageBitmap(file, { imageOrientation:'from-image' }); }catch(e){}
  try{ return await createImageBitmap(file); }catch(e){}
  // สำรอง: ใช้ <img> (เบราว์เซอร์สมัยใหม่ auto-orient ให้เอง)
  return await new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=rej;
    img.src=URL.createObjectURL(file);
  });
}

/* ===== โหลดป้ายสาขา (แคชไว้ ถ้าโหลดไม่ได้ให้ข้าม) ===== */
let stampPromise=null;
function loadStamp(){
  if(!stampPromise){
    stampPromise=new Promise(res=>{
      const img=new Image();
      img.onload=()=>res(img);
      img.onerror=()=>res(null);
      img.src=STAMP_DATA_URI;
    });
  }
  return stampPromise;
}

/* ===== ค่าปรับมุมรูปเริ่มต้น (ไม่ขยับ) ===== */
function defaultTf(){ return { ox:0, oy:0, s:1, rot:0 }; }

/* ===== วาดรูปลงช่อง โดยเริ่มจาก cover แล้วปรับตาม transform (เลื่อน/ซูม/หมุน) =====
   ox,oy = สัดส่วนการเลื่อนเทียบขนาดช่อง / s = ตัวคูณซูมจากฐาน cover / rot = องศา */
function drawCell(ctx,img,x,y,w,h,tf){
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  const cover=Math.max(w/iw, h/ih);       // ฐาน: ครอปให้เต็มช่อง
  const t = tf || defaultTf();
  const s = cover*(t.s||1);
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();       // ตัดขอบให้อยู่ในช่อง
  ctx.translate(x+w/2 + (t.ox||0)*w, y+h/2 + (t.oy||0)*h);
  ctx.rotate((t.rot||0)*Math.PI/180);
  ctx.scale(s,s);
  ctx.drawImage(img, -iw/2, -ih/2);
  ctx.restore();
}

/* ===== สี่เหลี่ยมมุมโค้ง ===== */
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ===== ประกอบภาพด้วย Canvas → คืนค่าเป็น Blob (JPEG 0.92) ===== */
async function compose(images, layout, count, center, dup){
  const size=CANVAS_SIZE, half=size/2;
  const canvas=document.createElement('canvas');
  canvas.width=size; canvas.height=size;
  const ctx=canvas.getContext('2d');

  // พื้นหลังขาว
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,size,size);

  // กำหนดช่องตามเลย์เอาต์ (สัดส่วนตามขนาดผืนผ้าใบ)
  let cells;
  if(count===1){
    cells=[[0,0,size,size]];                      // รูปเดียวเต็มผืนผ้าใบ
  }else if(count===4){
    cells=[[0,0,half,half],[half,0,half,half],[0,half,half,half],[half,half,half,half]]; // ซบ→ขบ→ซล→ขล
  }else if(layout==='tb'){
    cells=[[0,0,size,half],[0,half,size,half]];   // บน-ล่าง
  }else{
    cells=[[0,0,half,size],[half,0,half,size]];   // ซ้าย-ขวา
  }

  // วาดรูปลงแต่ละช่อง (ชนกันพอดี ไม่มีเส้นคั่น)
  for(let i=0;i<cells.length;i++){
    const src = dup ? images[0] : images[i];   // โหมดทำซ้ำ: ใช้รูปแรกเติมทุกช่อง
    if(!src) continue;
    const img=await loadBitmap(src.file);
    drawCell(ctx,img,cells[i][0],cells[i][1],cells[i][2],cells[i][3], src.tf);
    if(img.close) img.close();
  }

  // เตรียมฟอนต์ก่อนวัด/วาดข้อความ
  try{ await document.fonts.load('26px "Noto Sans Thai"'); }catch(e){}

  // ตัวคูณสัดส่วน (อิงฐาน 1280) เพื่อให้ป้าย/ตัวอักษรคงสัดส่วนเมื่อย่อขนาด
  const k=size/1280;

  // แปะป้ายสาขา — center=วางกลางผืน (โหมดจัดมุม) / ปกติ=กลางล่าง
  const dateStr=formatDDMMYY(dateInput.value||todayYMD());
  const stamp=await loadStamp();
  if(stamp){
    const sw=center ? size*0.36 : size*0.4;    // ป้ายกลางเล็กกว่าเล็กน้อย
    const sh=sw*((stamp.naturalHeight||stamp.height)/(stamp.naturalWidth||stamp.width));
    const sx=(size-sw)/2;
    const sy=center ? (size-sh)/2 : size-32*k-sh;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.25)';
    ctx.shadowBlur=20*k;
    ctx.shadowOffsetY=6*k;
    ctx.drawImage(stamp,sx,sy,sw,sh);
    ctx.restore();                 // รีเซ็ตเงา

    // เขียนวันที่ปัจจุบันลงกลางป้าย (ตรงเส้นคั่นสีทอง) อัตโนมัติทุกครั้ง
    const dcx=size/2, dcy=sy+sh*STAMP_DIVIDER_FRAC;
    const dFont=Math.round(sw*0.06);
    ctx.font=`700 ${dFont}px "Noto Sans Thai", system-ui, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const dw=ctx.measureText(dateStr).width;
    const px=16*k, py=6*k, ph=dFont+py*2, pw=dw+px*2;
    ctx.fillStyle='#ffffff';                    // แผ่นขาวกลบเส้นคั่น/เพชรทองด้านหลังตัวเลข
    roundRect(ctx,dcx-pw/2,dcy-ph/2,pw,ph,ph/2);
    ctx.fill();
    ctx.fillStyle='#16359b';                    // น้ำเงินเข้มเข้ากับตัวอักษรป้าย
    ctx.fillText(dateStr,dcx,dcy+1);
    ctx.textAlign='left';                       // รีเซ็ต

    // คำอธิบายเพิ่มเติม (ถ้ากรอก) วางใต้วันที่ในป้าย เหนือโลโก้ Lotus's
    const note=senderInput.value.trim();
    if(note){
      const ncx=size/2, ncy=sy+sh*0.79;
      let nFont=Math.round(sw*0.05);
      ctx.font=`600 ${nFont}px "Noto Sans Thai", system-ui, sans-serif`;
      const maxW=sw*0.9;
      let nw=ctx.measureText(note).width;
      if(nw>maxW){                              // ย่อฟอนต์ให้พอดีความกว้างป้าย
        nFont=Math.max(10,Math.floor(nFont*maxW/nw));
        ctx.font=`600 ${nFont}px "Noto Sans Thai", system-ui, sans-serif`;
        nw=ctx.measureText(note).width;
      }
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const npx=14*k, npy=6*k, nph=nFont+npy*2, npw=nw+npx*2;
      ctx.fillStyle='rgba(255,255,255,0.92)';   // แผ่นขาวรองพื้นให้อ่านง่าย
      roundRect(ctx,ncx-npw/2,ncy-nph/2,npw,nph,nph/2); ctx.fill();
      ctx.fillStyle='#16359b';
      ctx.fillText(note,ncx,ncy+1);
      ctx.textAlign='left';
    }
  }else{
    // สำรอง: ถ้าโหลดป้ายไม่ได้ ให้ปั๊มวันที่แคปซูลกลางล่าง
    ctx.font=`700 ${30*k}px "Noto Sans Thai", system-ui, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const dw=ctx.measureText(dateStr).width, ph=48*k, pw=dw+40*k;
    ctx.fillStyle='rgba(0,0,0,0.55)';
    roundRect(ctx,size/2-pw/2,size-40*k-ph,pw,ph,ph/2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(dateStr,size/2,size-40*k-ph/2+1);
    ctx.textAlign='left';
  }

  return await new Promise(res=> canvas.toBlob(b=>res(b),'image/jpeg',JPEG_QUALITY));
}

/* ===== เลื่อนแชทไปล่างสุดเสมอ ===== */
function scrollBottom(){
  requestAnimationFrame(()=>{ chat.scrollTop=chat.scrollHeight; });
}

/* ===== อัปเดตสถานะว่าง / เครื่องมือหัวแชท ===== */
function updateUI(){
  const isEmpty = state.sets.length===0 && state.pending.length===0;
  empty.style.display = isEmpty ? '' : 'none';
  emptyText.innerHTML = `เลือกรูปหรือถ่ายรูปเพื่อเริ่ม<br>ส่งครั้งละ ${state.setCount} รูป`;
  chatTools.classList.toggle('show', state.sets.length>0);
}

/* ===== สร้างบับเบิลผู้ใช้ (thumbnail ที่ส่งครบชุดแล้ว) ===== */
function makeUserBubble(images){
  const row=document.createElement('div'); row.className='row right';
  const bubble=document.createElement('div'); bubble.className='bubble user';
  const thumbs=document.createElement('div'); thumbs.className='thumbs';
  images.forEach(im=>{
    const t=document.createElement('div'); t.className='thumb';
    const img=document.createElement('img'); img.src=im.url; img.alt='รูปที่ส่ง';
    t.appendChild(img); thumbs.appendChild(t);
  });
  bubble.appendChild(thumbs); row.appendChild(bubble);
  return row;
}

/* ===== สร้างบับเบิลผลลัพธ์ (เริ่มด้วย loading) ===== */
function makeResultBubble(set){
  const row=document.createElement('div'); row.className='row left';
  const bubble=document.createElement('div'); bubble.className='bubble result';
  bubble.innerHTML='<div class="loading"><div class="spinner"></div>กำลังประมวลผล...</div>';
  row.appendChild(bubble);
  set.resultRow=row; set.resultBubble=bubble;
  return row;
}

/* ===== เรนเดอร์ผลลัพธ์ลงบับเบิล ===== */
async function renderSet(set){
  set.resultBubble.innerHTML='<div class="loading"><div class="spinner"></div>กำลังประมวลผล...</div>';
  const blob=await compose(set.images, set.layout, set.setCount, set.grid4==='center', set.dup);
  if(set.url) URL.revokeObjectURL(set.url);
  set.blob=blob;
  set.url=URL.createObjectURL(blob);

  // รูปผลลัพธ์ + ปุ่ม 3 ปุ่ม
  const wrap=document.createElement('div');
  const img=document.createElement('img'); img.className='output'; img.alt='ภาพรวมผลลัพธ์'; img.src=set.url;
  img.onload=scrollBottom;
  const actions=document.createElement('div'); actions.className='actions';

  const bShare=document.createElement('button'); bShare.className='action share';
  bShare.innerHTML=LINE_ICON+'แชร์ไลน์';
  bShare.onclick=()=>shareSet(set);

  const bDl=document.createElement('button'); bDl.className='action';
  bDl.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>ดาวน์โหลด';
  bDl.onclick=()=>downloadSet(set);

  const bRot=document.createElement('button'); bRot.className='action';
  bRot.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>ปรับมุมรูป';
  bRot.onclick=()=>openEditor(set);

  const bDel=document.createElement('button'); bDel.className='action danger';
  bDel.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>ลบ';
  bDel.onclick=()=>removeSet(set);

  actions.append(bShare,bDl,bRot,bDel);
  wrap.append(img,actions);
  set.resultBubble.innerHTML='';
  set.resultBubble.appendChild(wrap);
  scrollBottom();
}

/* ===== ยืนยันหนึ่งชุด (สร้างบับเบิลผู้ใช้ + ผลลัพธ์) ===== */
async function commitSet(images){
  const userRow=makeUserBubble(images);
  chat.appendChild(userRow);

  const set={ id:nextId++, images:images.slice(), layout:state.layout, setCount:state.setCount, grid4:state.grid4, dup:state.dup, userRow:userRow, url:null, blob:null };
  state.sets.push(set);
  const resultRow=makeResultBubble(set);
  chat.appendChild(resultRow);

  if(pendingEl) chat.appendChild(pendingEl);   // ให้คิวค้างอยู่ล่างสุดเสมอ
  updateUI(); scrollBottom();
  await renderSet(set);
}

/* ===== ลบชุด ===== */
function removeSet(set){
  const i=state.sets.indexOf(set);
  if(i>=0) state.sets.splice(i,1);
  if(set.url) URL.revokeObjectURL(set.url);
  set.images.forEach(im=>URL.revokeObjectURL(im.url));
  set.userRow.remove();
  set.resultRow.remove();
  updateUI();
}

/* ===== เรนเดอร์คิวที่ยังไม่ครบชุด ===== */
function renderPending(){
  if(state.pending.length===0){
    if(pendingEl){ pendingEl.remove(); pendingEl=null; }
    updateUI();
    return;
  }
  if(!pendingEl){
    pendingEl=document.createElement('div');
    pendingEl.className='row right';
    chat.appendChild(pendingEl);
  }
  const remain=state.setCount - state.pending.length;
  let html='<div class="bubble user"><div class="thumbs">';
  state.pending.forEach(im=>{
    html+=`<div class="thumb" data-pid="${im.pid}"><img src="${im.url}" alt="รูปในคิว"><button class="x" data-pid="${im.pid}" aria-label="ลบรูปนี้">×</button></div>`;
  });
  html+='</div><div class="pending-status">รออีก '+remain+' รูป...</div></div>';
  pendingEl.innerHTML=html;

  // ปุ่ม X ลบรูปในคิว
  pendingEl.querySelectorAll('.x').forEach(btn=>{
    btn.onclick=()=>{
      const id=Number(btn.dataset.pid);
      const idx=state.pending.findIndex(p=>p.pid===id);
      if(idx>=0){ URL.revokeObjectURL(state.pending[idx].url); state.pending.splice(idx,1); }
      renderPending();
    };
  });
  chat.appendChild(pendingEl); // อยู่ล่างสุด
  updateUI(); scrollBottom();
}

/* ===== รับไฟล์เข้าคิว แล้วตัดเป็นชุดอัตโนมัติ ===== */
async function addFiles(fileList){
  const files=Array.from(fileList||[]).filter(f=>f.type.startsWith('image/'));
  if(files.length===0) return;
  setSettingsOpen(false);              // เริ่มมีรูปแล้ว → พับแผงตั้งค่าอัตโนมัติ
  // โหมดทำซ้ำ: รูปแต่ละใบสร้างเป็น 1 ชุด (เติมทุกช่องด้วยรูปเดียว) ทันที
  if(state.dup){
    for(const f of files){
      await commitSet([{ pid:pid++, file:f, url:URL.createObjectURL(f) }]);
    }
    return;
  }
  files.forEach(f=> state.pending.push({ pid:pid++, file:f, url:URL.createObjectURL(f) }));
  await flushPending();
  renderPending();
}

/* ===== ตัดคิวเป็นชุด ๆ ตราบใดที่ครบจำนวน ===== */
async function flushPending(){
  while(state.pending.length >= state.setCount){
    const setImages=state.pending.splice(0, state.setCount);
    await commitSet(setImages);
  }
}

/* ตรวจว่าเป็น iOS (iPhone/iPad) ที่ดาวน์โหลดตรงเข้าแกลเลอรีไม่ได้ */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

/* ===== ดาวน์โหลดหนึ่งไฟล์ ===== */
function triggerDownload(url, name){
  const a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}
function downloadSet(set){
  if(!set.url) return;
  // iOS เซฟลงแกลเลอรีตรง ๆ ไม่ได้ → เปิด Share sheet ให้เลือก "บันทึกภาพ"
  if(IS_IOS && set.blob && navigator.canShare){
    const file=setToFile(set, state.sets.indexOf(set)+1);
    if(navigator.canShare({ files:[file] })){
      navigator.share({ files:[file] }).catch(()=>{});
      return;
    }
  }
  triggerDownload(set.url, buildFileName(state.sets.indexOf(set)+1));
}
async function downloadAll(){
  // iOS: ดาวน์โหลดหลายไฟล์พร้อมกันไม่ได้ → ใช้ Share sheet (เลือก "บันทึกภาพ")
  if(IS_IOS){ await shareAll(); return; }
  for(let i=0;i<state.sets.length;i++){
    const s=state.sets[i];
    if(!s.url) continue;
    triggerDownload(s.url, buildFileName(i+1));
    await new Promise(r=>setTimeout(r,300));   // หน่วงระหว่างไฟล์ 300ms
  }
}

/* ===== แชร์ไปไลน์ (Web Share API — เปิดชีตแชร์ให้เลือกไลน์) ===== */
function setToFile(set, index){
  return new File([set.blob], buildFileName(index), { type:'image/jpeg' });
}
async function shareSet(set){
  if(!set.blob) return;
  const file=setToFile(set, state.sets.indexOf(set)+1);
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file] }); }
    catch(e){ /* ผู้ใช้ยกเลิก */ }
  }else{
    // อุปกรณ์ไม่รองรับแชร์ไฟล์ตรง → ดาวน์โหลดแล้วส่งไลน์เอง
    downloadSet(set);
    alert('อุปกรณ์นี้แชร์เข้าไลน์ตรงไม่ได้ (มักเป็นบนคอมฯ)\nดาวน์โหลดรูปแล้วแนบส่งในไลน์เองนะ');
  }
}
async function shareAll(){
  const files=state.sets.filter(s=>s.blob).map((s,i)=>setToFile(s, i+1));
  if(files.length===0) return;
  if(navigator.canShare && navigator.canShare({ files })){
    try{ await navigator.share({ files }); }
    catch(e){ /* ยกเลิก */ }
  }else if(files.length===1){
    await shareSet(state.sets[0]);
  }else{
    alert('อุปกรณ์นี้แชร์หลายรูปพร้อมกันไม่ได้\nใช้ปุ่ม "แชร์ไลน์" ทีละรูป หรือกด "ดาวน์โหลดทั้งหมด" แทนนะ');
  }
}

/* ===== ล้างแชท ===== */
function clearChat(){
  if(state.sets.length===0 && state.pending.length===0) return;
  if(!confirm('ล้างแชททั้งหมด?')) return;
  state.sets.forEach(s=>{ if(s.url) URL.revokeObjectURL(s.url); s.images.forEach(im=>URL.revokeObjectURL(im.url)); });
  state.pending.forEach(im=>URL.revokeObjectURL(im.url));
  state.sets=[]; state.pending=[];
  if(pendingEl){ pendingEl.remove(); pendingEl=null; }
  chat.querySelectorAll('.row').forEach(r=>r.remove());
  senderInput.value='';                 // ล้างคำอธิบายเพิ่มเติมด้วย (เริ่มแชทใหม่)
  saveSettings();
  updateUI();
}

/* ===== อัปเดตปุ่ม segmented ===== */
function setPressed(group, attr, value){
  group.querySelectorAll('button').forEach(b=>{
    b.setAttribute('aria-pressed', String(b.dataset[attr]===value));
  });
}

/* ===== ผูกเหตุการณ์ ===== */
function setSettingsOpen(open){
  settings.classList.toggle('open', open);
  btnSettings.setAttribute('aria-expanded', String(open));
  settings.setAttribute('aria-hidden', String(!open));
}
btnSettings.onclick=()=> setSettingsOpen(!settings.classList.contains('open'));
btnApply.onclick=()=> setSettingsOpen(false);   // ปรับใช้ = พับแผงเก็บ
btnClear.onclick=clearChat;
btnAll.onclick=downloadAll;
btnShareAll.onclick=shareAll;

senderInput.oninput=saveSettings;
dateInput.onchange=updateDateDisplay;

function updateSubFields(){
  layoutField.style.display = state.setCount===2 ? '' : 'none';  // เลือกกริดย่อยเฉพาะ 2 รูป
  grid4Field.style.display  = state.setCount===4 ? '' : 'none';  // เลือกรูปแบบป้ายเฉพาะ 4 รูป
  dupField.style.display    = state.setCount>1 ? '' : 'none';    // ทำซ้ำเฉพาะเมื่อมีหลายช่อง
}
segCount.onclick=async(e)=>{
  const b=e.target.closest('button[data-count]'); if(!b) return;
  state.setCount=Number(b.dataset.count);
  setPressed(segCount,'count',b.dataset.count);
  updateSubFields();
  saveSettings();
  await flushPending(); renderPending(); updateUI();
};
segLayout.onclick=(e)=>{
  const b=e.target.closest('button[data-layout]'); if(!b) return;
  state.layout=b.dataset.layout;
  setPressed(segLayout,'layout',b.dataset.layout);
  saveSettings();
};
segGrid4.onclick=(e)=>{
  const b=e.target.closest('button[data-grid4]'); if(!b) return;
  state.grid4=b.dataset.grid4;
  setPressed(segGrid4,'grid4',b.dataset.grid4);
  saveSettings();
};
segDup.onclick=async(e)=>{
  const b=e.target.closest('button[data-dup]'); if(!b) return;
  state.dup=(b.dataset.dup==='on');
  setPressed(segDup,'dup',b.dataset.dup);
  saveSettings();
  // เปิดโหมดทำซ้ำ: เคลียร์คิวที่ค้าง (คิวใช้ไม่ได้ในโหมดนี้)
  if(state.dup && state.pending.length){
    state.pending.forEach(im=>URL.revokeObjectURL(im.url));
    state.pending=[]; renderPending();
  }
};

filePick.onchange=e=>{ addFiles(e.target.files); e.target.value=''; };
fileCam.onchange =e=>{ addFiles(e.target.files); e.target.value=''; };

/* วางจาก clipboard */
window.addEventListener('paste', e=>{
  if(e.clipboardData && e.clipboardData.files && e.clipboardData.files.length){
    addFiles(e.clipboardData.files);
  }
});

/* ลากไฟล์มาวาง (drag & drop) */
let dragDepth=0;
window.addEventListener('dragenter', e=>{ e.preventDefault(); dragDepth++; dropOverlay.classList.add('show'); });
window.addEventListener('dragover',  e=>{ e.preventDefault(); });
window.addEventListener('dragleave', e=>{ e.preventDefault(); if(--dragDepth<=0){ dragDepth=0; dropOverlay.classList.remove('show'); } });
window.addEventListener('drop', e=>{
  e.preventDefault(); dragDepth=0; dropOverlay.classList.remove('show');
  if(e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
});

/* ===================================================================
   ===== หน้าต่างปรับมุมรูป (เลื่อน/ซูม/หมุน + กดค้างเพื่อสลับ) =====
   =================================================================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ED={ set:null, order:[], cells:[], tfMap:null, sel:-1, swapEnabled:false,
  pointers:new Map(), mode:null, ghost:null, srcCellIdx:-1, lpTimer:null,
  start:null, last:null, last2:null, pinchRef:null };

function openEditor(set){
  ED.set=set;
  ED.swapEnabled = !set.dup && set.setCount>1;
  const n=set.setCount;
  if(set.dup)        ED.order=Array.from({length:n},()=>set.images[0]);
  else if(n===1)     ED.order=[set.images[0]];
  else               ED.order=set.images.slice(0,n);
  // ค่าปรับมุม (working) แยกตามรูปจริง (ref) จะได้กดยกเลิกแล้วไม่กระทบของเดิม
  ED.tfMap=new Map();
  [...new Set(ED.order)].forEach(ref=>ED.tfMap.set(ref, Object.assign(defaultTf(), ref.tf||{})));
  buildEditGrid();
  editorOverlay.classList.add('show');
  editorOverlay.setAttribute('aria-hidden','false');
  requestAnimationFrame(()=>selectCell(0));
}

function buildEditGrid(){
  const n=ED.order.length, layout=ED.set.layout, count=ED.set.setCount;
  let cols='1fr 1fr', rows='1fr';
  if(count===1){ cols='1fr'; rows='1fr'; }
  else if(count===4){ cols='1fr 1fr'; rows='1fr 1fr'; }
  else if(layout==='tb'){ cols='1fr'; rows='1fr 1fr'; }
  else { cols='1fr 1fr'; rows='1fr'; }
  editGrid.style.gridTemplateColumns=cols;
  editGrid.style.gridTemplateRows=rows;
  editGrid.innerHTML='';
  ED.cells=[];
  for(let i=0;i<n;i++){
    const ref=ED.order[i];
    const cell=document.createElement('div'); cell.className='edit-cell'; cell.dataset.index=i;
    const img=document.createElement('img'); img.alt=''; img.draggable=false;
    cell.appendChild(img);
    if(ED.swapEnabled){ const num=document.createElement('div'); num.className='num'; num.textContent=i+1; cell.appendChild(num); }
    editGrid.appendChild(cell);
    const c={el:cell, img, ref, iw:ref._iw||0, ih:ref._ih||0};
    ED.cells.push(c);
    bindCellImage(c,i);
  }
}
function bindCellImage(c,i){
  c.img.onload=()=>{ c.ref._iw=c.img.naturalWidth; c.ref._ih=c.img.naturalHeight; c.iw=c.ref._iw; c.ih=c.ref._ih; applyCell(i); };
  c.img.src=c.ref.url;
  if(c.iw) applyCell(i);
}
function applyCell(i){
  const c=ED.cells[i]; if(!c||!c.iw) return;
  const rect=c.el.getBoundingClientRect(); const vw=rect.width, vh=rect.height;
  const tf=ED.tfMap.get(c.ref);
  const base=Math.max(vw/c.iw, vh/c.ih);
  const k=base*(tf.s||1);
  c.img.style.transform=`translate(-50%,-50%) translate(${(tf.ox||0)*vw}px, ${(tf.oy||0)*vh}px) rotate(${tf.rot||0}deg) scale(${k})`;
}
function applyAll(){ ED.cells.forEach((c,i)=>applyCell(i)); }

function selectCell(i){
  if(i<0||i>=ED.cells.length) return;
  ED.sel=i;
  ED.cells.forEach((c,idx)=>c.el.classList.toggle('selected', idx===i));
  syncSliders();
}
function syncSliders(){
  if(ED.sel<0) return;
  const tf=ED.tfMap.get(ED.cells[ED.sel].ref);
  zoomRange.value=String(clamp(Math.round((tf.s||1)*100), +zoomRange.min, +zoomRange.max));
  rotRange.value=String(clamp(Math.round(tf.rot||0), +rotRange.min, +rotRange.max));
}

/* ----- ท่าทางนิ้ว/เมาส์ ----- */
function pinchData(pts){
  const [a,b]=pts, dx=b.x-a.x, dy=b.y-a.y;
  return { dist:Math.hypot(dx,dy)||1, ang:Math.atan2(dy,dx)*180/Math.PI, mx:(a.x+b.x)/2, my:(a.y+b.y)/2 };
}
editGrid.addEventListener('pointerdown', e=>{
  const cellEl=e.target.closest('.edit-cell'); if(!cellEl) return;
  e.preventDefault();
  try{ editGrid.setPointerCapture(e.pointerId); }catch(_){}
  const i=+cellEl.dataset.index;
  ED.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,i});
  if(ED.pointers.size===1){
    selectCell(i);
    ED.mode=null; ED.srcCellIdx=i;
    ED.start={x:e.clientX,y:e.clientY}; ED.last={x:e.clientX,y:e.clientY};
    if(ED.swapEnabled){
      clearTimeout(ED.lpTimer);
      ED.lpTimer=setTimeout(()=>startSwap(i, ED.last.x, ED.last.y), 350);
    }
  }else if(ED.pointers.size===2){
    clearTimeout(ED.lpTimer);
    ED.mode='pinch';
    ED.pinchRef=ED.cells[ED.sel]?ED.cells[ED.sel].ref:ED.cells[i].ref;
    ED.last2=pinchData([...ED.pointers.values()]);
  }
});
editGrid.addEventListener('pointermove', e=>{
  const p=ED.pointers.get(e.pointerId); if(!p) return;
  p.x=e.clientX; p.y=e.clientY;
  if(ED.mode==='swap'){ moveGhost(e.clientX,e.clientY); highlightTarget(e.clientX,e.clientY); return; }
  if(ED.pointers.size>=2 && ED.mode==='pinch'){
    const cur=pinchData([...ED.pointers.values()].slice(0,2));
    const ref=ED.pinchRef, tf=ED.tfMap.get(ref);
    tf.s=clamp((tf.s||1)*(cur.dist/ED.last2.dist), 0.2, 8);
    tf.rot=(tf.rot||0)+(cur.ang-ED.last2.ang);
    const c=ED.cells[ED.sel]||ED.cells[0]; const rect=c.el.getBoundingClientRect();
    tf.ox=(tf.ox||0)+(cur.mx-ED.last2.mx)/rect.width;
    tf.oy=(tf.oy||0)+(cur.my-ED.last2.my)/rect.height;
    ED.last2=cur; applyAll(); syncSliders();
    return;
  }
  if(ED.pointers.size===1){
    if(ED.mode!=='pan' && Math.hypot(e.clientX-ED.start.x, e.clientY-ED.start.y)>8){
      clearTimeout(ED.lpTimer); ED.mode='pan';
    }
    if(ED.mode==='pan'){
      const c=ED.cells[ED.srcCellIdx]; const rect=c.el.getBoundingClientRect();
      const tf=ED.tfMap.get(c.ref);
      tf.ox=(tf.ox||0)+(e.clientX-ED.last.x)/rect.width;
      tf.oy=(tf.oy||0)+(e.clientY-ED.last.y)/rect.height;
      applyAll();
    }
    ED.last={x:e.clientX,y:e.clientY};
  }
});
function endPointer(e){
  clearTimeout(ED.lpTimer);
  if(ED.mode==='swap') finishSwap(e.clientX,e.clientY);
  ED.pointers.delete(e.pointerId);
  if(ED.pointers.size===0){ ED.mode=null; }
  else if(ED.pointers.size===1){
    const rp=[...ED.pointers.values()][0];
    ED.last={x:rp.x,y:rp.y}; ED.mode='pan';   // เหลือนิ้วเดียว → เลื่อนต่อได้
  }
}
editGrid.addEventListener('pointerup', endPointer);
editGrid.addEventListener('pointercancel', e=>{ clearTimeout(ED.lpTimer); cleanupSwap(); ED.pointers.delete(e.pointerId); if(ED.pointers.size===0) ED.mode=null; });

/* ----- สลับตำแหน่งด้วยการกดค้าง ----- */
function startSwap(i,x,y){
  ED.mode='swap'; ED.srcCellIdx=i;
  ED.cells[i].el.classList.add('lift');
  const g=document.createElement('div'); g.className='drag-ghost';
  const im=document.createElement('img'); im.src=ED.cells[i].ref.url; g.appendChild(im);
  document.body.appendChild(g); ED.ghost=g; moveGhost(x,y);
  if(navigator.vibrate) try{ navigator.vibrate(15); }catch(_){}
}
function moveGhost(x,y){ if(ED.ghost){ ED.ghost.style.left=x+'px'; ED.ghost.style.top=y+'px'; } }
function highlightTarget(x,y){
  const el=document.elementFromPoint(x,y); const cellEl=el&&el.closest?el.closest('.edit-cell'):null;
  ED.cells.forEach(c=>c.el.classList.remove('target'));
  if(cellEl && +cellEl.dataset.index!==ED.srcCellIdx) cellEl.classList.add('target');
}
function finishSwap(x,y){
  const el=document.elementFromPoint(x,y); const cellEl=el&&el.closest?el.closest('.edit-cell'):null;
  if(cellEl){
    const j=+cellEl.dataset.index;
    if(j!==ED.srcCellIdx){
      const t=ED.order[ED.srcCellIdx]; ED.order[ED.srcCellIdx]=ED.order[j]; ED.order[j]=t;
      for(let i=0;i<ED.cells.length;i++){ ED.cells[i].ref=ED.order[i]; ED.cells[i].iw=ED.order[i]._iw||0; ED.cells[i].ih=ED.order[i]._ih||0; bindCellImage(ED.cells[i],i); }
    }
  }
  cleanupSwap();
}
function cleanupSwap(){
  if(ED.ghost){ ED.ghost.remove(); ED.ghost=null; }
  ED.cells.forEach(c=>c.el.classList.remove('lift','target'));
  ED.mode=null;
}

/* ----- แถบเลื่อน ซูม/หมุน + รีเซ็ต ----- */
zoomRange.oninput=()=>{ if(ED.sel<0) return; ED.tfMap.get(ED.cells[ED.sel].ref).s=+zoomRange.value/100; applyAll(); };
rotRange.oninput =()=>{ if(ED.sel<0) return; ED.tfMap.get(ED.cells[ED.sel].ref).rot=+rotRange.value; applyAll(); };
resetCell.onclick=()=>{ if(ED.sel<0) return; const ref=ED.cells[ED.sel].ref; ED.tfMap.set(ref, defaultTf()); syncSliders(); applyAll(); };

/* ----- ปิด/บันทึก ----- */
function closeEditor(save){
  const s=ED.set;
  if(save && s){
    ED.tfMap.forEach((tf,ref)=>{ ref.tf=Object.assign({},tf); });
    if(ED.swapEnabled) s.images=ED.order.slice();
  }
  editorOverlay.classList.remove('show');
  editorOverlay.setAttribute('aria-hidden','true');
  cleanupSwap();
  ED.pointers.clear(); ED.set=null; ED.cells=[]; ED.sel=-1;
  if(save && s) renderSet(s);
}
editCancel.onclick=()=>closeEditor(false);
editSave.onclick=()=>closeEditor(true);
editorOverlay.addEventListener('pointerdown', e=>{ if(e.target===editorOverlay) closeEditor(false); });
window.addEventListener('resize', ()=>{ if(ED.set) applyAll(); });

/* ===== เริ่มต้น ===== */
(function init(){
  const s=loadSettings();
  // คำอธิบายเพิ่มเติม: เว้นว่างเป็นดีฟอลต์เสมอ (ไม่จำค่าเดิม)
  // จำนวนรูปต่อชุด: ดีฟอลต์ 2 รูป เสมอ (ไม่จำค่าเดิม)
  // ทำซ้ำรูปเดียว: ดีฟอลต์ ปิด เสมอ (ไม่จำค่าเดิม)
  if(s.layout==='tb'){ state.layout='tb'; }
  if(s.grid4==='bottom'){ state.grid4='bottom'; }   // ดีฟอลต์ ป้ายกลาง, จำค่าเดิมถ้าเคยเลือกป้ายล่าง
  setPressed(segCount,'count',String(state.setCount));
  setPressed(segLayout,'layout',state.layout);
  setPressed(segGrid4,'grid4',state.grid4);
  setPressed(segDup,'dup',state.dup?'on':'off');
  updateSubFields();

  dateInput.value=todayYMD();     // ค่าเริ่มต้นเป็นวันนี้
  updateDateDisplay();
  updateUI();
})();

/* ===== ลงทะเบียน Service Worker (PWA/ออฟไลน์) =====
   ทำงานเฉพาะเมื่อเปิดผ่าน http(s) เท่านั้น (เปิดไฟล์ file:// จะข้าม) */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
